<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #fff;
      background: #080808;
      font-family: Arial, sans-serif;
    }
    .profile-card {
      width: min(100%, 420px);
      padding: 32px 24px;
      text-align: center;
      background: #171717;
      border: 1px solid #353535;
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
    }
    .avatar {
      width: 104px;
      height: 104px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #303030;
      object-fit: cover;
      font-size: 42px;
    }
    h1 { margin: 0 0 8px; font-size: 25px; }
    #email { margin: 0 0 26px; color: #bbb; overflow-wrap: anywhere; }
    button {
      padding: 12px 24px;
      border: 0;
      border-radius: 10px;
      background: #fff;
      color: #111;
      font-size: 16px;
      cursor: pointer;
      transition: transform .2s;
    }
    button:hover { transform: scale(1.04); }
    #status { min-height: 20px; margin-top: 14px; color: #ffb3b3; font-size: 14px; }
  </style>
</head>
<body>
  <main class="profile-card">
    <div id="avatarFallback" class="avatar" aria-hidden="true">&#128100;</div>
    <img id="avatar" class="avatar" alt="Foto profil" hidden>
    <h1 id="name">Memuat profil...</h1>
    <p id="email"></p>
    <button id="logoutButton" type="button" hidden>Log out</button>
    <p id="status" role="status"></p>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDBlXHuc682eJ3wiGEVYWiUpi0wv6jwEco",
      authDomain: "myweb-id.firebaseapp.com",
      projectId: "myweb-id",
      storageBucket: "myweb-id.firebasestorage.app",
      messagingSenderId: "273192370569",
      appId: "1:273192370569:web:0156d6fad96522e30c2158",
      measurementId: "G-EDW1MCYTME"
    };

    const auth = getAuth(initializeApp(firebaseConfig));
    const nameElement = document.getElementById("name");
    const emailElement = document.getElementById("email");
    const avatar = document.getElementById("avatar");
    const avatarFallback = document.getElementById("avatarFallback");
    const logoutButton = document.getElementById("logoutButton");
    const status = document.getElementById("status");

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.replace("index.html");
        return;
      }
      nameElement.textContent = user.displayName || "Pengunjung";
      emailElement.textContent = user.email || "";
      if (user.photoURL) {
        avatar.src = user.photoURL;
        avatar.hidden = false;
        avatarFallback.hidden = true;
      }
      logoutButton.hidden = false;
    });

    logoutButton.addEventListener("click", async () => {
      logoutButton.disabled = true;
      status.textContent = "Sedang keluar...";
      try {
        await signOut(auth);
        window.location.replace("index.html");
      } catch (error) {
        console.error("Logout gagal:", error);
        status.textContent = "Logout gagal. Coba lagi.";
        logoutButton.disabled = false;
      }
    });
  </script>
  <a href="index.html" style="position: absolute; top: 16px; left: 16px; color: #fff; text-decoration: none;">&larr; Kembali</a>
</body>
</html>
