<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("site-theme") || "slate";</script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--profile-text, #f4f5fb);
      background: var(--profile-background, linear-gradient(145deg, #151c2c, #111827 48%, #182232));
      font-family: Arial, sans-serif;
    }
    html[data-theme="slate"] { --profile-text: #f4f5fb; --profile-muted: #a8afc2; --profile-background: radial-gradient(ellipse at 12% 8%, rgba(88,105,190,.28), transparent 38%), radial-gradient(ellipse at 88% 22%, rgba(39,133,154,.18), transparent 34%), radial-gradient(ellipse at 52% 100%, rgba(111,79,155,.16), transparent 42%), linear-gradient(145deg, #151c2c, #111827 48%, #182232); --profile-card: rgba(19,22,33,.88); --profile-line: rgba(255,255,255,.11); }
    html[data-theme="white"] { color-scheme: light; --profile-text: #202a3a; --profile-muted: #596579; --profile-background: linear-gradient(145deg, #f8fafc, #e9eef5); --profile-card: rgba(255,255,255,.9); --profile-line: rgba(28,39,56,.14); }
    html[data-theme="dark"] { --profile-text: #f4f5fb; --profile-muted: #a8afc2; --profile-background: #080a0f; --profile-card: #14161c; --profile-line: rgba(255,255,255,.1); }
    .profile-card {
      width: min(100%, 420px);
      padding: 32px 24px;
      text-align: center;
      background: var(--profile-card);
      border: 1px solid var(--profile-line);
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
      backdrop-filter: blur(14px);
    }
    .avatar {
      width: 104px;
      height: 104px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #303030;
      object-fit: cover;
      font-size: 42px;
    }
    h1 { margin: 0 0 8px; font-size: 25px; }
    #email { margin: 0 0 26px; color: var(--profile-muted); overflow-wrap: anywhere; }
    .theme-settings { margin: 24px 0; padding: 18px; border: 1px solid var(--profile-line); border-radius: 14px; text-align: left; }
    .theme-settings h2 { margin: 0 0 12px; font-size: 16px; }
    .theme-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    button {
      padding: 12px 24px;
      border: 1px solid var(--profile-line);
      border-radius: 10px;
      background: #202638;
      color: var(--profile-text);
      font-size: 14px;
      cursor: pointer;
      transition: transform .2s, border-color .2s, background .2s;
    }
    button:hover { transform: translateY(-1px); }
    .theme-options button[aria-pressed="true"] { border-color: #82d8ff; background: rgba(130,216,255,.12); }
    #logoutButton { margin-top: 8px; background: #30384a; }
    .back-link { position: absolute; top: 16px; left: 16px; color: var(--profile-text); text-decoration: none; }
    html[data-theme="white"] #logoutButton { background: #e8edf4; }
    [hidden] { display: none !important; }
    #status { min-height: 20px; margin-top: 14px; color: #ffb3b3; font-size: 14px; }
  </style>
</head>
<body>
  <main class="profile-card">
    <div id="avatarFallback" class="avatar" aria-hidden="true">&#128100;</div>
    <img id="avatar" class="avatar" alt="Foto profil" hidden>
    <h1 id="name">Memuat profil...</h1>
    <p id="email"></p>
    <section class="theme-settings" aria-labelledby="themeTitle">
      <h2 id="themeTitle">Tampilan latar</h2>
      <div class="theme-options" role="group" aria-label="Pilih latar belakang">
        <button type="button" data-theme-choice="slate" aria-pressed="false">Slate</button>
        <button type="button" data-theme-choice="white" aria-pressed="false">Putih</button>
        <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
      </div>
    </section>
    <button id="logoutButton" type="button" hidden>Log out</button>
    <p id="status" role="status"></p>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import {
      getAuth,
      setPersistence,
      browserLocalPersistence,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDBlXHuc682eJ3wiGEVYWiUpi0wv6jwEco",
      authDomain: "myweb-id.firebaseapp.com",
      projectId: "myweb-id",
      storageBucket: "myweb-id.firebasestorage.app",
      messagingSenderId: "273192370569",
      appId: "1:273192370569:web:0156d6fad96522e30c2158",
      measurementId: "G-EDW1MCYTME"
    };

    const auth = getAuth(initializeApp(firebaseConfig));
    try {
      await setPersistence(auth, browserLocalPersistence);
    } catch (error) {
      console.warn("Persistensi login lokal tidak tersedia:", error);
    }
    const nameElement = document.getElementById("name");
    const emailElement = document.getElementById("email");
    const avatar = document.getElementById("avatar");
    const avatarFallback = document.getElementById("avatarFallback");
    const logoutButton = document.getElementById("logoutButton");
    const status = document.getElementById("status");

    const themeButtons = document.querySelectorAll("[data-theme-choice]");
    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem("site-theme", theme);
      themeButtons.forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.themeChoice === theme));
      });
    }
    themeButtons.forEach((button) => button.addEventListener("click", () => setTheme(button.dataset.themeChoice)));
    setTheme(document.documentElement.dataset.theme || "slate");

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.replace("index.html");
        return;
      }
      nameElement.textContent = user.displayName || "Pengunjung";
      emailElement.textContent = user.email || "";
      if (user.photoURL) {
        avatar.src = user.photoURL;
        avatar.hidden = false;
        avatarFallback.hidden = true;
      }
      logoutButton.hidden = false;
    });

    logoutButton.addEventListener("click", async () => {
      logoutButton.disabled = true;
      status.textContent = "Sedang keluar...";
      try {
        await signOut(auth);
        window.location.replace("index.html");
      } catch (error) {
        console.error("Logout gagal:", error);
        status.textContent = "Logout gagal. Coba lagi.";
        logoutButton.disabled = false;
      }
    });
  </script>
  <a class="back-link" id="backToHome" href="index.html">&larr; Kembali</a>
  <script>
    document.getElementById("backToHome").addEventListener("click", (event) => {
      const previousPage = new URL(document.referrer || "", window.location.href);
      const cameFromHome = previousPage.origin === window.location.origin &&
        (previousPage.pathname === "/" || previousPage.pathname.endsWith("/index.html"));
      if (cameFromHome) {
        event.preventDefault();
        window.history.back();
      }
    });
  </script>
</body>
</html>
