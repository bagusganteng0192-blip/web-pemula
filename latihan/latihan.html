<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latian</title>
</head>
    <body>
        <script src="script.js" defer></script>
    <a href="index.html"><h1>kembali ke halaman pertama</h1></a>
<button id="tombol">klik here</button>
<a id="lampu">🌑Lampu Mati</a>

<script>
    const tombol = document.getElementById("tombol");
    tombol.addEventListener("click", () => {
        const lampu = document.getElementById("lampu");
        if (lampu.textContent === "🌑Lampu Mati") {
            lampu.textContent = "💡Lampu Hidup";
        } else {
            lampu.textContent = "🌑Lampu Mati";
        }
    });
</script>
<p>Tekan <kbd>Ctrl</kbd> + <kbd>S</kbd> untuk download</p>

<h2>Informasi Perangkat</h2>

<button id="cekPerangkat">Cek Perangkat</button>

<pre id="hasilPerangkat"></pre>

<script>
document.getElementById("cekPerangkat").addEventListener("click", () => {
  const hasil = document.getElementById("hasilPerangkat");

  hasil.textContent =
    "Ukuran layar: " + screen.width + " × " + screen.height + "\n" +
    "Ukuran halaman: " + innerWidth + " × " + innerHeight + "\n" +
    "Bahasa browser: " + navigator.language + "\n" +
    "Platform browser: " + (navigator.userAgentData?.platform || navigator.platform || "Tidak diketahui") + "\n" +
    "Jumlah logical CPU: " + (navigator.hardwareConcurrency || "Tidak diketahui");
});
</script>

    </body>
</html>
