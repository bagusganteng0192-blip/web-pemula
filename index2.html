<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil</title>
  <script>document.documentElement.dataset.theme = "slate";</script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--profile-text, #f4f5fb);
      background: var(--profile-background, linear-gradient(145deg, #151c2c, #111827 48%, #182232));
      font-family: Arial, sans-serif;
    }
    html[data-theme="slate"] { --profile-text: #f4f5fb; --profile-muted: #a8afc2; --profile-background: radial-gradient(ellipse at 12% 8%, rgba(88,105,190,.28), transparent 38%), radial-gradient(ellipse at 88% 22%, rgba(39,133,154,.18), transparent 34%), radial-gradient(ellipse at 52% 100%, rgba(111,79,155,.16), transparent 42%), linear-gradient(145deg, #151c2c, #111827 48%, #182232); --profile-card: rgba(19,22,33,.88); --profile-line: rgba(255,255,255,.11); }
    .profile-card {
      width: min(100%, 1120px);
      padding: 32px 24px;
      text-align: center;
      background: var(--profile-card);
      border: 1px solid var(--profile-line);
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
      backdrop-filter: blur(14px);
    }
    .avatar {
      width: 104px;
      height: 104px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #303030;
      object-fit: cover;
      font-size: 42px;
    }
    h1 { margin: 0 0 8px; font-size: 25px; }
    #email { margin: 0 0 26px; color: var(--profile-muted); overflow-wrap: anywhere; }
    button {
      padding: 12px 24px;
      border: 1px solid var(--profile-line);
      border-radius: 10px;
      background: #202638;
      color: var(--profile-text);
      font-size: 14px;
      cursor: pointer;
      transition: transform .2s, border-color .2s, background .2s;
    }
    button:hover { transform: translateY(-1px); }
    .liked-videos { margin: 30px 0 8px; text-align: left; }
    .liked-videos h2 { margin: 0 0 16px; font-size: 20px; color: var(--profile-text); }
    .liked-videos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .liked-video-card { min-width: 0; padding: 12px; border: 1px solid var(--profile-line); border-radius: 16px; background: rgba(0,0,0,.12); }
    .liked-video-frame { display: grid; width: 100%; max-height: 420px; aspect-ratio: 9 / 16; overflow: hidden; place-items: center; border-radius: 11px; background: #050609; }
    .liked-poster-link { display: grid; width: 100%; height: 100%; place-items: center; background: #050609; }
    .liked-poster-link img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .liked-poster-missing { padding: 24px; color: var(--profile-muted); font-size: 13px; text-align: center; }
    .liked-video-title { margin: 10px 2px 2px; color: var(--profile-text); font-size: 14px; font-weight: 700; }
    .liked-video-credit { margin: 0 2px; color: var(--profile-muted); font-size: 12px; overflow-wrap: anywhere; }
    .liked-empty { margin: 0; color: var(--profile-muted); text-align: left; }
    @media (max-width: 520px) { .liked-videos-grid { grid-template-columns: 1fr; } }
    #logoutButton { margin-top: 8px; background: #30384a; }
    .back-link { position: absolute; top: 16px; left: 16px; color: var(--profile-text); text-decoration: none; }
    [hidden] { display: none !important; }
    #status { min-height: 20px; margin-top: 14px; color: #ffb3b3; font-size: 14px; }
  </style>
</head>
<body>
  <main class="profile-card">
    <div id="avatarFallback" class="avatar" aria-hidden="true">&#128100;</div>
    <img id="avatar" class="avatar" alt="Foto profil" hidden>
    <h1 id="name">Memuat profil...</h1>
    <p id="email"></p>
    <section class="liked-videos" aria-labelledby="likedVideosTitle">
      <h2 id="likedVideosTitle">Video yang disukai <span id="likedVideosCount">(0)</span></h2>
      <p id="likedVideosEmpty" class="liked-empty">Belum ada video yang disukai.</p>
      <div id="likedVideosGrid" class="liked-videos-grid"></div>
    </section>
    <button id="logoutButton" type="button" hidden>Log out</button>
    <p id="status" role="status"></p>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import {
      getAuth,
      setPersistence,
      browserLocalPersistence,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDBlXHuc682eJ3wiGEVYWiUpi0wv6jwEco",
      authDomain: "myweb-id.firebaseapp.com",
      projectId: "myweb-id",
      storageBucket: "myweb-id.firebasestorage.app",
      messagingSenderId: "273192370569",
      appId: "1:273192370569:web:0156d6fad96522e30c2158",
      measurementId: "G-EDW1MCYTME"
    };

    const auth = getAuth(initializeApp(firebaseConfig));
    try {
      await setPersistence(auth, browserLocalPersistence);
    } catch (error) {
      console.warn("Persistensi login lokal tidak tersedia:", error);
    }
    const nameElement = document.getElementById("name");
    const emailElement = document.getElementById("email");
    const avatar = document.getElementById("avatar");
    const avatarFallback = document.getElementById("avatarFallback");
    const logoutButton = document.getElementById("logoutButton");
    const status = document.getElementById("status");
    const likedVideosGrid = document.getElementById("likedVideosGrid");
    const likedVideosCount = document.getElementById("likedVideosCount");
    const likedVideosEmpty = document.getElementById("likedVideosEmpty");

    function readStoredArray(key) {
      try {
        const value = JSON.parse(localStorage.getItem(key) || "[]");
        return Array.isArray(value) ? value : [];
      } catch {
        return [];
      }
    }

    function readVideoCatalog() {
      try {
        const value = JSON.parse(localStorage.getItem("site-video-catalog") || "{}");
        return value && typeof value === "object" ? value : {};
      } catch {
        return {};
      }
    }

    function renderLikedVideos() {
      const likedKeys = readStoredArray("site-liked-videos");
      const catalog = readVideoCatalog();
      likedVideosGrid.replaceChildren();
      likedVideosCount.textContent = `(${likedKeys.length})`;
      likedVideosEmpty.hidden = likedKeys.length > 0;

      likedKeys.forEach((key) => {
        const record = catalog[key] || {};
        const sourcePath = record.src || key;
        const card = document.createElement("article");
        card.className = "liked-video-card";
        const frame = document.createElement("div");
        frame.className = "liked-video-frame";
        const link = document.createElement("a");
        link.className = "liked-poster-link";
        const destination = new URL("index.html", window.location.href);
        destination.searchParams.set("video", sourcePath);
        link.href = destination.href;
        link.setAttribute("aria-label", `Putar ${record.collectionName || "video yang disukai"}`);
        if (record.poster) {
          const poster = document.createElement("img");
          poster.src = record.poster;
          poster.alt = record.collectionName ? `Poster ${record.collectionName}` : "Poster video yang disukai";
          poster.loading = "lazy";
          poster.addEventListener("load", () => {
            frame.style.aspectRatio = `${poster.naturalWidth} / ${poster.naturalHeight}`;
          }, { once: true });
          link.append(poster);
        } else {
          const placeholder = document.createElement("span");
          placeholder.className = "liked-poster-missing";
          placeholder.textContent = "Poster tidak tersedia - Buka video";
          link.append(placeholder);
        }
        frame.append(link);
        const title = document.createElement("p");
        title.className = "liked-video-title";
        title.textContent = record.collectionName || "Video yang disukai";
        const credit = document.createElement("p");
        credit.className = "liked-video-credit";
        credit.textContent = record.credit || "";
        credit.hidden = !record.credit;
        card.append(frame, title, credit);
        likedVideosGrid.append(card);
      });
    }

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.replace("index.html");
        return;
      }
      nameElement.textContent = user.displayName || "Pengunjung";
      emailElement.textContent = user.email || "";
      if (user.photoURL) {
        avatar.src = user.photoURL;
        avatar.hidden = false;
        avatarFallback.hidden = true;
      }
      logoutButton.hidden = false;
      renderLikedVideos();
    });

    logoutButton.addEventListener("click", async () => {
      logoutButton.disabled = true;
      status.textContent = "Sedang keluar...";
      try {
        await signOut(auth);
        window.location.replace("index.html");
      } catch (error) {
        console.error("Logout gagal:", error);
        status.textContent = "Logout gagal. Coba lagi.";
        logoutButton.disabled = false;
      }
    });
  </script>
  <a class="back-link" id="backToHome" href="index.html">&larr; Kembali</a>
  <script>
    document.getElementById("backToHome").addEventListener("click", (event) => {
      const previousPage = new URL(document.referrer || "", window.location.href);
      const cameFromHome = previousPage.origin === window.location.origin &&
        (previousPage.pathname === "/" || previousPage.pathname.endsWith("/index.html"));
      if (cameFromHome) {
        event.preventDefault();
        window.history.back();
      }
    });
  </script>
</body>
</html>
